# Roles a session may claim, and the paths each role may write with the file tools.
# Format: <role> <glob> [<glob> ...]   (globs are relative to the project root; * spans /)
# A role with no globs is read-only: no file edits and only read-only shell commands.
#
# orchestrator: drafts and dispatches work orders; never writes code.
# worker:       implements an order inside the order's allowed paths (the review checks them).
# docs:         documentation only.
# reviewer:     reads, runs read-only commands, reports. Never edits.
orchestrator  orders/*  docs/*
worker        *
docs          docs/*  *.md
reviewer
